apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "org.jetbrains.kotlin.android"

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

react {
    // This is required for React Native 0.73+
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'
def flipperVersion = findProperty("FLIPPER_VERSION") ?: "0.273.0"

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace "com.homeservices.providerapp"

    defaultConfig {
        applicationId "com.homeservices.providerapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
                storeFile file(MYAPP_RELEASE_STORE_FILE)
                storePassword MYAPP_RELEASE_STORE_PASSWORD
                keyAlias MYAPP_RELEASE_KEY_ALIAS
                keyPassword MYAPP_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true // Remove unused resources
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Generate native debug symbols for crash analysis
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    packagingOptions {
        // Enable 16 KB page size support for Android 15+
        jniLibs {
            useLegacyPackaging = false
        }
        // Suppress warnings for third-party libraries that aren't 16 KB aligned yet
        // These libraries will still work in page size compatible mode
        // Fix duplicate META-INF files issue - pick first occurrence
        resources {
            pickFirsts += [
                'META-INF/BC2048KE.SF',
                'META-INF/BC2048KE.DSA',
                'META-INF/BC2048KE.RSA',
                'META-INF/BC1024KE.DSA',
                'META-INF/com.android.tools/proguard/coroutines.pro'
            ]
        }
    }

    sourceSets {
        main {
            java {
                srcDirs += [
                    "$buildDir/generated/rncli/src/main/java"
                ]
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // Force modern Material/AppCompat resources (fixes missing m3_* and material_* drawables during merge)
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.appcompat:appcompat:1.7.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Flipper (debug only) — registers the app with Flipper Desktop
    debugImplementation("com.facebook.flipper:flipper:${flipperVersion}") {
        exclude group: 'com.facebook.fbjni'
    }
    debugImplementation "com.facebook.flipper:flipper-network-plugin:${flipperVersion}"
    
    // OneSignal SDK
    implementation 'com.onesignal:OneSignal:[5.0.0, 5.99.99]'
}

// Ensure PackageList is generated before Kotlin compilation
afterEvaluate {
    tasks.named("compileDebugKotlin").configure {
        dependsOn("generateCodegenArtifactsFromSchema")
    }
}

// Apply Google Services plugin for Firebase
apply plugin: 'com.google.gms.google-services'
